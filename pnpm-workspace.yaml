packages:
  - examples/*
  - examples/module/playground
  - stubs/*

overrides:
  '@cucumber/cucumber': 13.3.0
  '@nuxt/schema': 4.6.3
  '@nuxt/kit-nightly>@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610292252-da55a91
  '@nuxt/nitro-server-nightly>@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610292252-da55a91
  '@nuxt/vite-builder-nightly>@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610292252-da55a91
  nuxt-nightly>@nuxt/schema: npm:@nuxt/schema-nightly@5.0.0-2610292252-da55a91
  '@nuxt/test-utils': workspace:*
  '@types/node': 24.19.2
  rollup: 4.65.0
  vite: 8.3.5
  vite-node: 6.0.0
  vitest: 5.0.5
  vue: ^3.5.44
  happy-dom: 21.0.4
  jsdom: 30.1.3

shellEmulator: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt
  - nuxt-nightly
  - vue
  - '@vue/*'
  - unimport@7.0.1

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  oxc-resolver: false
  unrs-resolver: false
  vue-demi: false
