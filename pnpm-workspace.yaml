packages:
  - examples/*
  - examples/module/playground
  - stubs/*

overrides:
  '@cucumber/cucumber': 13.2.1
  '@nuxt/schema': 4.5.2
  '@nuxt/test-utils': workspace:*
  '@types/node': 24.13.3
  rollup: 4.62.4
  vite: 8.2.0
  vite-node: 6.0.0
  vitest: 4.1.10
  vue: ^3.5.40

patchedDependencies:
  node-mock-http: patches/node-mock-http.patch

shellEmulator: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  oxc-resolver: false
  unrs-resolver: false
  vue-demi: false
