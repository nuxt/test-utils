packages:
  - examples/*
  - examples/module/playground
  - stubs/*

overrides:
  '@cucumber/cucumber': 13.2.1
  '@nuxt/schema': 4.6.1
  '@nuxt/kit-nightly>@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610091123-a44843a
  '@nuxt/nitro-server-nightly>@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610091123-a44843a
  '@nuxt/vite-builder-nightly>@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610091123-a44843a
  nuxt-nightly>@nuxt/schema: npm:@nuxt/schema-nightly@5.0.0-2610091123-a44843a
  '@nuxt/test-utils': workspace:*
  '@types/node': 24.19.0
  rollup: 4.64.0
  vite: 8.3.2
  vite-node: 6.0.0
  vitest: 5.0.2
  vue: ^3.5.43
  happy-dom: 20.14.5
  jsdom: 30.1.1

shellEmulator: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt
  - nuxt-nightly
  - vue
  - '@vue/*'
  - unimport@7.0.1

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  oxc-resolver: false
  unrs-resolver: false
  vue-demi: false
