packages:
  - examples/*
  - examples/module/playground
  - stubs/*

overrides:
  '@cucumber/cucumber': 12.9.0
  '@nuxt/schema': 4.5.2
  '@nuxt/test-utils': workspace:*
  '@types/node': 24.13.3
  rollup: 4.63.1
  vite: 8.2.2
  vite-node: 6.0.0
  vitest: 4.1.11
  vue: ^3.5.42

patchedDependencies:
  node-mock-http: patches/node-mock-http.patch

shellEmulator: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt
  - nuxt-nightly
  - vue
  - '@vue/*'

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: false
  oxc-resolver: false
  unrs-resolver: false
  vue-demi: false
